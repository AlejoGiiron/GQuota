<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>G-Quota · Login (ingreso) — exploración</title>
<link rel="stylesheet" href="gquota.css" />
<link rel="stylesheet" href="gq-login.css" />
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#0c1f1a"/>
    <rect x="30" y="30" width="40" height="40" rx="11" fill="#d97706"/>
    <text x="50" y="64" font-family="sans-serif" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">G</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="gq-common.jsx"></script>
<script type="text/babel" src="gq-login.jsx"></script>

<script type="text/babel">
  function App() {
    return (
      <DesignCanvas>
        <DCSection id="escritorio" title="Ingreso · Escritorio" subtitle="Login / Iniciar sesión · 1440 px · dos layouts">
          <DCArtboard id="l-v1" label="V1 · Pantalla dividida (con error)" width={1440} height={840}>
            <LoginV1 />
          </DCArtboard>
          <DCArtboard id="l-v2" label="V2 · Tarjeta centrada" width={1440} height={840}>
            <LoginV2 />
          </DCArtboard>
        </DCSection>

        <DCSection id="movil" title="Ingreso · Móvil" subtitle="Logo arriba, formulario centrado · 390 px">
          <DCArtboard id="m-1" label="Estado normal" width={390} height={844}>
            <MobileLogin />
          </DCArtboard>
          <DCArtboard id="m-2" label="Con error" width={390} height={844}>
            <MobileLogin showError={true} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
