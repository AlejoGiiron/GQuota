## Contexto del modelo (para entender, no para reescribir)
G-Quota maneja dos formas de cobro del interés, por préstamo:
- Sobre saldo: interés del periodo = saldo de capital vigente x tasa mensual (baja al abonar).
- Sobre capital inicial: interés del periodo = capital inicial x tasa mensual (fijo hasta saldar).
El interés NO capitaliza: el devengo mensual lo acumula en interesPendiente, nunca al capital. Un pago cubre primero el interés pendiente y el resto abona a capital.

## Tareas
- Crea src/lib/motor-prestamos.ts y src/lib/motor-prestamos.test.ts con el contenido EXACTO de los archivos que adjunto. No cambies la lógica ni las firmas.
- Instala vitest y agrega el script "test" (vitest run) en package.json.

- Sobre saldo: capital 1.000.000, tasa 10%. Mes 1 interés 100.000; pagan 200.000 -> 100.000 interés + 100.000 capital, saldo 900.000. Mes 2 interés = 90.000 (sobre el saldo).
- Sobre capital inicial: mismo arranque. Mes 2 interés = 100.000 (sobre el inicial, NO 90.000).
- Pago solo interés: pagan exactamente el interés -> capital intacto.
- Interés impago se acumula sin capitalizar: dos meses sin pagar -> interesPendiente suma, capital intacto.
- Cierre: saldo de capital llega a 0 -> préstamo saldado.
- Pago de más -> excedente (saldo a favor), capital no baja de 0.

## Objetivo
Registrar pagos usando el motor, sin reimplementar fórmulas.

## Lógica (usa aplicarPago del motor)
Al registrar un pago de monto P sobre un préstamo:
- El interés pendiente lo trae el préstamo (lo devengado y no pagado).
- aplicarPago reparte: cubre interés pendiente primero, el resto abona a capital; devuelve saldo_anterior, saldo_posterior, monto_interes, monto_capital y excedente.
- Si saldo_posterior llega a 0 -> el préstamo pasa a estado 'pagado'.

## Tareas
- Acción "Registrar pago" desde la ficha del préstamo: monto y método de pago (efectivo, Nequi, Daviplata, transferencia).
- Antes de confirmar, muestra el desglose que devuelve el motor: "De tu pago de [P], [interés] van a interés y [capital] a capital. Nuevo saldo: [saldo]". Así el usuario ve a dónde va su plata.
- Al confirmar (en una transacción):
  1. Inserta el movimiento (tipo 'cuota' si abona a capital, 'interes' si solo cubre interés) con monto_interes, monto_capital, saldo_anterior, saldo_posterior, metodo_pago.
  2. Actualiza el préstamo: saldo_capital e interes_pendiente; si saldo 0 -> estado 'pagado'.
- Comprobante simple del pago, para mostrar o compartir.

- Pagan exactamente 100.000 -> todo a interés, saldo intacto.
- Pagan 1.100.000 con saldo 1.000.000 + interés 100.000 -> salda el préstamo, estado 'pagado'.

'claude-root':`# G-Quota — contexto del proyecto

## Descripción
G-Quota es una app web responsive para personas que prestan dinero de forma informal en Colombia. Permite llevar el control de clientes deudores, préstamos, intereses, cuotas y pagos.

## Stack
- Vite + React + TypeScript
- Tailwind CSS
- React Router
- Supabase (PostgreSQL, autenticación, Edge Functions, storage)
- vitest (pruebas) · sonner (toasts)

## Estructura
- src/components — componentes reutilizables
- src/pages — pantallas
- src/contexts — contextos (auth)
- src/lib — clientes y lógica (supabase.ts, motor-prestamos.ts, formatters.ts)
- src/hooks — hooks
- src/types — tipos (database.types.ts)
- supabase/migrations — esquema SQL

## Convenciones
- Todo el texto de la interfaz en español (Colombia).
- Montos SIEMPRE con fmtCOP() de src/lib/formatters.ts (pesos, sin decimales). Fechas con fmtFecha() (dd/mm/aaaa).
- Toda consulta a Supabase filtra por el usuario autenticado; la RLS lo exige.
- Sin any en TypeScript.
- Errores con toast.error(), éxito con toast.success().
- Pruebas con vitest: npm test.
- Commits en formato Conventional Commits.

## Núcleo financiero
Los cálculos de interés y pagos viven SOLO en src/lib/motor-prestamos.ts (lógica pura, con pruebas). Maneja dos modos de interés (sobre saldo y sobre capital inicial) y el interés NO capitaliza. No dupliques fórmulas en la UI ni en las consultas: usa ese módulo.

## Design system
Antes de crear o modificar cualquier componente o pantalla, leer src/design-system.md y seguir esos patrones. No inventar colores, tipografías ni estilos. Ese archivo es la fuente de verdad visual.`,

'claude-src':`# src — guía de implementación

## Componentes
- Lee src/design-system.md antes de crear cualquier pantalla o componente.
- Componentes pequeños y reutilizables en src/components; pantallas en src/pages.
- Estados obligatorios en toda vista con datos: cargando (skeleton), vacío (con acción), error (mensaje claro).
- Toast de éxito/error después de cada mutación (sonner).

## Datos
- Acceso a Supabase vía src/lib/supabase.ts. Filtra siempre por el usuario.
- Tipos desde src/types/database.types.ts (generados desde el esquema; regéneralos tras cada migración).
- Mutaciones que tocan varias tablas (ej. registrar pago, crear préstamo) van en una transacción o función de Supabase.

## Dinero y cálculos
- Todo cálculo de interés/pago usa src/lib/motor-prestamos.ts. No reimplementar fórmulas.
- Formatear montos con fmtCOP() (es-CO, sin decimales).

## Idioma
- Interfaz y mensajes en español.`,

 SECTIONS[p.id]=`
<div class="eyebrow">Fase ${p.num}</div>
<h1><span class="num">${p.num}</span> · ${p.title}</h1>
<p class="section-meta"><b>${p.sub}</b> · ${p.weeks} · ${p.prompts.length} prompt${p.prompts.length>1?'s':''} secuencial${p.prompts.length>1?'es':''}</p>
<h2>Stack de esta fase</h2>
<div class="pills">${stack}</div>
<h2>Prompts para Claude Code</h2>
${cards}
<div class="note">${p.note}</div>`;
});

SECTIONS.git = `
<div class="eyebrow">Recursos</div>
<h1>Git workflow</h1>
<p class="lede">Ramas: <b>main</b> (producción), <b>develop</b> (integración) y <b>feature/0X-nombre</b> (una por fase). Conventional Commits.</p>
<h2>Inicio del proyecto</h2>
${codeBlock('git-setup')}
<h2>Por cada fase</h2>
${codeBlock('git-fase')}
<h2>.gitignore</h2>
${codeBlock('gitignore')}`;

SECTIONS.claudemd = `
<div class="eyebrow">Recursos</div>
<h1>Archivos CLAUDE.md</h1>
<p class="lede">Dan a Claude Code todo el contexto sin que tengas que explicar nada. El raíz va en la carpeta del proyecto; el otro en src/. Se crean en la Fase 01.</p>
<h2>CLAUDE.md (raíz)</h2>
${codeBlock('claude-root')}
<h2>src/CLAUDE.md</h2>
${codeBlock('claude-src')}`;

SECTIONS.comandos = `
<div class="eyebrow">Recursos</div>
<h1>Comandos /project</h1>
<p class="lede">Van en .claude/commands/ (un archivo .md por comando). Los usas en Claude Code escribiendo, por ejemplo, /project:componente. Aceleran todo de la Fase 02 en adelante.</p>
${codeBlock('cmd-componente')}
${codeBlock('cmd-tabla')}
${codeBlock('cmd-modulo')}
${codeBlock('cmd-revisar')}
${codeBlock('cmd-commit')}`;

const phaseNav = document.getElementById('phase-nav');
phaseNav.innerHTML = PHASES.map(p=>`<div class="nav-item" data-id="${p.id}"><span class="nav-num">${p.num}</span>${p.title}</div>`).join('');

function show(id){
 document.getElementById('content').innerHTML = SECTIONS[id] || '<p>Sección no encontrada</p>';
 document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.id===id));
 document.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>show(el.dataset.go)));
 document.querySelector('.main').scrollTo(0,0);
}
document.querySelectorAll('.nav-item').forEach(el=>el.addEventListener('click',()=>show(el.dataset.id)));

function cp(btn,key){
 navigator.clipboard.writeText(DATA[key]).then(()=>{
  const t=btn.textContent; btn.textContent='Copiado'; btn.classList.add('done');
  setTimeout(()=>{btn.textContent=t; btn.classList.remove('done');},1300);
 });
}

show('overview');
</script>
